# =========================
# DATABASE
# =========================
# Sem variaveis de ambiente, usa o PostgreSQL local de desenvolvimento.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotels_db?sslmode=disable}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# SERVER
# =========================
server.port=${PORT:8080}

# =========================
# SESSION (cookie de login)
# =========================
# Em producao, com frontend em outro dominio (HTTPS):
#   SESSION_COOKIE_SECURE=true
#   SESSION_COOKIE_SAMESITE=none
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.timeout=8h

# =========================
# CORS (origens do frontend, separadas por virgula)
# =========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================
# ADMINISTRADOR INICIAL
# =========================
# Criado na primeira execucao se as duas variaveis estiverem definidas.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# =========================
# CLOUDINARY (obrigatorio: defina por variavel de ambiente)
# =========================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# =========================
# LOGGING
# =========================
logging.level.org.springframework.security=INFO
logging.level.com.example.Backend_hotels=INFO
